version: '3.8'
services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: property_db
    ports:
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
  web:
    build: .
    restart: always
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/property_db
    ports:
      - "3000:3000"

volumes:
  db-data:
